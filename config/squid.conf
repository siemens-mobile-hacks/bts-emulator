http_port 3128
pid_filename none
cache deny all
access_log none
cache_log /dev/null

acl phones src 172.16.32.0/24
http_access allow phones
http_access allow localhost
http_access deny all

acl mmsc_domains dstdomain "/run/operators/operator-mmsc-domains.txt"
acl mmsc_ips dst "/run/operators/operator-mmsc-ips.txt"
cache_peer 127.0.0.1 parent 8002 0 no-query originserver name=mmsc
cache_peer_access mmsc allow mmsc_domains
cache_peer_access mmsc allow mmsc_ips
never_direct allow mmsc_domains
never_direct allow mmsc_ips
